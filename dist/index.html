<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心屿｜情绪日记与自我关怀</title><meta name="description" content="记录情绪，理解触发，温柔照顾自己。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232e6755'/%3E%3Cpath d='M18 35c9 10 19 10 28 0' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='26' r='3' fill='%23fff'/%3E%3Ccircle cx='40' cy='26' r='3' fill='%23fff'/%3E%3C/svg%3E"><style>
:root{--ink:#18342c;--muted:#61746c;--paper:#f8faf7;--card:#fff;--line:#dbe6df;--mint:#dcefe4;--leaf:#2e6755;--sun:#f4b96a;--shadow:0 14px 38px rgba(30,75,58,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#e2f3e9 0,transparent 31%),var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button{font:inherit;cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:26px 22px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{font-weight:700;font-size:22px;letter-spacing:.06em}.brand i{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:7px;background:var(--leaf);color:white;border-radius:11px;font-style:normal;font-size:16px}.privacy{font-size:13px;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.65)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:var(--shadow)}h1{font-size:34px;line-height:1.3;margin:0 0 8px;letter-spacing:-.04em}h2{font-size:18px;margin:0 0 15px}p{color:var(--muted);line-height:1.65;margin:0}.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:23px 0 22px}.mood{border:1px solid transparent;background:#f1f6f2;border-radius:17px;min-height:78px;color:var(--ink);font-size:13px}.mood span{display:block;font-size:25px;margin-bottom:4px}.mood.active{background:var(--leaf);color:#fff;box-shadow:0 8px 16px rgba(46,103,85,.2)}.labels{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.label{padding:8px 11px;border-radius:99px;border:1px solid var(--line);background:white;color:var(--muted);font-size:13px}.label.selected{background:var(--mint);border-color:#a7cdb5;color:var(--ink)}textarea{width:100%;height:84px;border:1px solid var(--line);border-radius:15px;margin-top:20px;padding:12px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;background:#fcfdfb}textarea:focus{outline:2px solid #b8d9c5;border-color:transparent}.save{margin-top:13px;width:100%;border:0;border-radius:14px;background:var(--ink);color:white;padding:13px;font-weight:600}.side{display:grid;gap:22px}.care{background:linear-gradient(135deg,#fff7e8,#fff);border-color:#f1dfbc}.tag{font-size:13px;color:#8c6430}.care h2{font-size:22px;margin:8px 0}.care button{width:100%;margin-top:19px;padding:12px;border-radius:13px;border:1px solid #e2c48e;background:#fff8e9;color:#714b1b}.insight{position:relative;overflow:hidden}.bars{height:80px;display:flex;align-items:flex-end;gap:9px;margin:15px 2px 6px}.bar{width:22px;background:var(--mint);border-radius:7px 7px 2px 2px}.bar.hot{background:var(--sun)}.days{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.observe{margin-top:17px;padding:12px;background:#f4f8f5;border-radius:13px;font-size:13px;color:#385549;line-height:1.55}.actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.action{padding:20px;border-radius:20px;border:1px solid var(--line);background:var(--card)}.action b{display:block;margin:8px 0 4px}.action .icon{font-size:25px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:var(--ink);color:white;padding:12px 17px;border-radius:12px;font-size:14px;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}.safety{margin:22px auto 0;max-width:720px;font-size:12px;text-align:center;color:var(--muted)}@media(max-width:720px){.wrap{padding:19px 14px 35px}.privacy{font-size:11px}.grid{grid-template-columns:1fr}.panel{padding:20px;border-radius:20px}h1{font-size:28px}.moods{gap:6px}.mood{min-height:69px;font-size:11px}.mood span{font-size:22px}.actions{grid-template-columns:1fr}.top{margin-bottom:23px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><i>♡</i>心屿</div><div class="privacy">🔒 仅你可见 · 数据留在此设备</div></header><main class="grid"><section class="panel"><h1>先照顾此刻的自己。</h1><p>用半分钟，记录现在的感受。</p><div class="moods" aria-label="选择情绪"><button class="mood" data-mood="平静"><span>😌</span>平静</button><button class="mood" data-mood="低落"><span>😔</span>低落</button><button class="mood active" data-mood="焦虑"><span>😣</span>焦虑</button><button class="mood" data-mood="疲惫"><span>😮‍💨</span>疲惫</button><button class="mood" data-mood="烦躁"><span>😤</span>烦躁</button></div><h2 id="trigger-title">是什么让你感到焦虑？</h2><div class="labels" id="labels"><button class="label selected">工作 / 学业</button><button class="label">人际关系</button><button class="label">睡眠不足</button><button class="label">社交媒体</button><button class="label">其他</button></div><textarea id="note" placeholder="写一句就好：今天开会前，心里一直很紧……"></textarea><button class="save" id="save">保存这一次感受</button></section><aside class="side"><section class="panel care"><div class="tag" id="plan-tag">3 分钟呼吸练习</div><h2 id="plan-title">把注意力带回身体</h2><p id="plan-copy">吸气 4 拍，呼气 6 拍。让紧绷先慢一点松开。</p><button id="start">开始练习</button></section><section class="panel insight"><h2>本周心情</h2><p>情绪有波动，也是一种被看见的生活。</p><div class="bars" aria-label="本周情绪强度"><i class="bar" style="height:31%"></i><i class="bar" style="height:55%"></i><i class="bar" style="height:40%"></i><i class="bar hot" style="height:84%"></i><i class="bar hot" style="height:68%"></i><i class="bar" style="height:38%"></i><i class="bar" style="height:47%"></i></div><div class="days"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="observe">观察到：工作 / 学业是本周最常出现的触发因素。周末的情绪恢复更明显。</div></section></aside><section class="actions"><article class="action"><div class="icon">☊</div><b>听一段音乐</b><p>给脑海留一点空白。</p></article><article class="action"><div class="icon">◌</div><b>做 3 分钟冥想</b><p>把注意力轻轻拉回当下。</p></article><article class="action"><div class="icon">⌁</div><b>动一动</b><p>90 秒肩颈拉伸，也算开始。</p></article></section></main><p class="safety">心屿不提供心理诊断或危机干预。如你有自伤或伤害他人的紧急风险，请立即联系当地急救服务、心理危机热线或可信赖的人。</p></div><div class="toast" id="toast" role="status"></div><script>
const plans={平静:['今日自我关怀','留住这份平稳','用 5 分钟写下今天一件让你安心的小事。'],低落:['轻柔音乐','允许自己慢一点','戴上耳机，听一段舒缓音乐；今天不必立刻解决所有事。'],焦虑:['3 分钟呼吸练习','把注意力带回身体','吸气 4 拍，呼气 6 拍。让紧绷先慢一点松开。'],疲惫:['微型恢复','先补一点能量','喝水、伸展，或去窗边走 2 分钟。'],烦躁:['短时运动','把能量安全地释放','试试 90 秒原地快走或肩颈拉伸。']};let current='焦虑';const toast=t=>{const x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)};document.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mood').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.mood;const p=plans[current];document.querySelector('#trigger-title').textContent='是什么让你感到'+current+'？';document.querySelector('#plan-tag').textContent=p[0];document.querySelector('#plan-title').textContent=p[1];document.querySelector('#plan-copy').textContent=p[2]});document.querySelectorAll('.label').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));document.querySelector('#save').onclick=()=>{localStorage.setItem('xinyu-entry',JSON.stringify({mood:current,note:document.querySelector('#note').value,at:Date.now()}));toast('已保存。谢谢你愿意看见自己。')};document.querySelector('#start').onclick=()=>toast('练习开始：下一次呼气时，轻轻放松肩膀。');
</script></body></html>
